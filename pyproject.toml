[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "siyuan-note-cli"
version = "0.1.0"
description = "CLI for operating SiYuan notes through the local HTTP API."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "briqt"}]
dependencies = []

[project.scripts]
siyuan-note-cli = "siyuan_note_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["siyuan_note_cli*"]

[tool.setuptools.package-dir]
"" = "src"
