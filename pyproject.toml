[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "siyuan-cli"
version = "0.2.3"
description = "CLI for operating SiYuan notes through the local HTTP API."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "briqt"}]
dependencies = []

[project.scripts]
siyuan-cli = "src.cli:main"

[tool.setuptools]
packages = ["src"]
