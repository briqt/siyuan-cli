[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "siyuan-cli"
dynamic = ["version"]
description = "CLI for operating SiYuan notes through the local HTTP API."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "briqt"}]
dependencies = []

[project.scripts]
siyuan-cli = "siyuan_cli.cli:main"

[tool.setuptools]
packages = ["siyuan_cli"]

[tool.setuptools.dynamic]
version = {attr = "siyuan_cli.__version__"}
